name: Build Android mobile app

on:
  workflow_dispatch:
  push:
    branches: [main, mobile-app]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android.yml"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform wrappers
        working-directory: mobile
        run: |
          custom_files="$(mktemp -d)"
          cp -R lib "$custom_files/lib"
          cp -R test "$custom_files/test"
          cp pubspec.yaml analysis_options.yaml "$custom_files/"
          cp android/app/src/main/AndroidManifest.xml "$custom_files/AndroidManifest.xml"
          flutter create \
            --platforms=android,ios \
            --org=com.lukeyechen \
            --project-name=diffusion_portfolio_mobile \
            .
          cp -R "$custom_files/lib/." lib/
          cp -R "$custom_files/test/." test/
          cp "$custom_files/pubspec.yaml" "$custom_files/analysis_options.yaml" .
          cp "$custom_files/AndroidManifest.xml" android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Test
        working-directory: mobile
        run: flutter test

      - name: Build Android APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Build Android App Bundle
        working-directory: mobile
        run: flutter build appbundle --release

      - name: Upload Android builds
        uses: actions/upload-artifact@v4
        with:
          name: diffusion-portfolio-android
          if-no-files-found: error
          retention-days: 14
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
