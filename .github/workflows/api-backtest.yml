name: API backtest checks

on:
  pull_request:
    paths:
      - "api.py"
      - "core/**"
      - "views/Backtest.py"
      - "tests/test_api.py"
      - "tests/test_short_horizon_portfolio.py"
      - ".github/workflows/api-backtest.yml"
  push:
    branches: [main]
    paths:
      - "api.py"
      - "core/**"
      - "views/Backtest.py"
      - "tests/test_api.py"
      - "tests/test_short_horizon_portfolio.py"
      - ".github/workflows/api-backtest.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API test dependencies
        run: python -m pip install fastapi google-auth numpy pandas scipy scikit-learn yfinance pytest
      - name: Check backtest API and rolling engine
        run: python -m pytest -q tests/test_api.py tests/test_short_horizon_portfolio.py
