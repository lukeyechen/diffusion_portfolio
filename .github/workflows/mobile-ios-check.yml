name: Check iPhone mobile build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-without-signing:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform wrappers
        working-directory: mobile
        run: |
          custom_files="$(mktemp -d)"
          cp -R lib "$custom_files/lib"
          cp -R test "$custom_files/test"
          cp pubspec.yaml analysis_options.yaml "$custom_files/"
          cp android/app/src/main/AndroidManifest.xml "$custom_files/AndroidManifest.xml"
          flutter create \
            --platforms=android,ios \
            --org=com.lukeyechen \
            --project-name=diffusion_portfolio_mobile \
            .
          cp -R "$custom_files/lib/." lib/
          cp -R "$custom_files/test/." test/
          cp "$custom_files/pubspec.yaml" "$custom_files/analysis_options.yaml" .
          cp "$custom_files/AndroidManifest.xml" android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze and test
        working-directory: mobile
        run: |
          flutter analyze
          flutter test

      - name: Compile iPhone app without signing
        working-directory: mobile
        run: >-
          flutter build ios --release --no-codesign
          --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }}

      - name: Upload unsigned iPhone build
        uses: actions/upload-artifact@v4
        with:
          name: diffusion-portfolio-ios-unsigned
          if-no-files-found: error
          retention-days: 7
          path: mobile/build/ios/iphoneos/Runner.app
