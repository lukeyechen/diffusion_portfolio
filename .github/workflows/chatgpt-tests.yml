name: ChatGPT Test Run

on:
  push:
    branches:
      - chatgpt-test-20260906

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest suite
        run: pytest -q
      - name: Run 1M diffusion vs equal-weight backtest
        run: python scripts/chatgpt_1m_backtest.py
      - name: Upload 1M backtest CSVs
        uses: actions/upload-artifact@v4
        with:
          name: one-month-backtest
          path: |
            one_month_backtest_summary.csv
            one_month_backtest_detail.csv
