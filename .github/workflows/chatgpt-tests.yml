name: ChatGPT Test Run

on:
  push:
    branches:
      - chatgpt-test-20260906

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest suite
        run: pytest -q
      - name: Run active Best-T turnover upgrade comparison
        run: python scripts/chatgpt_turnover_upgrade_bestT.py
      - name: Upload Best-T turnover CSVs
        uses: actions/upload-artifact@v4
        with:
          name: bestT-turnover-upgrade-comparison
          path: |
            turnover_bestT_summary.csv
            turnover_bestT_detail.csv
            turnover_bestT_t_diagnostics.csv
            turnover_bestT_comparison.csv
