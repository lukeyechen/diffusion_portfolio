name: ChatGPT Test Run

on:
  push:
    branches:
      - chatgpt-test-20260906

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest suite
        run: pytest -q
      - name: Compile Streamlit views and comparison engines
        run: |
          python -m py_compile app.py \
            views/Portfolio_Upgraded.py \
            views/Method_Comparison_Upgraded.py \
            views/Method_Comparison_Legacy_Upgraded.py \
            core/short_horizon_portfolio.py \
            core/legacy_periodic_oos.py
      - name: Calculate latest recommended weights
        run: python scripts/chatgpt_latest_recommended_weights.py
      - name: Upload latest recommended weights
        uses: actions/upload-artifact@v4
        with:
          name: latest-recommended-weights
          path: latest_recommended_weights.csv
