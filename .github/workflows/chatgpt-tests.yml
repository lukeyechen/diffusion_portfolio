name: ChatGPT Test Run

on:
  push:
    branches:
      - chatgpt-test-20260906

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest suite
        run: pytest -q
      - name: Run exact 5-method comparison
        run: python scripts/chatgpt_5method_comparison.py
      - name: Upload 5-method comparison CSVs
        uses: actions/upload-artifact@v4
        with:
          name: five-method-comparison
          path: |
            five_method_comparison_summary.csv
            five_method_comparison_detail.csv
            five_method_latest_weights.csv
      - name: Run nested-T holding-period comparison
        run: python scripts/chatgpt_nested_holding_comparison.py
      - name: Upload nested holding-period CSVs
        uses: actions/upload-artifact@v4
        with:
          name: nested-holding-comparison
          path: |
            nested_holding_summary.csv
            nested_holding_detail.csv
            nested_holding_t_diagnostics.csv
            nested_holding_latest_weights.csv
