substitutions:
  _GOOGLE_OAUTH_CLIENT_IDS: "CONFIGURE_ME.apps.googleusercontent.com"
  _ALLOWED_GOOGLE_EMAILS: "st.yeyo@gmail.com"

steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/diffusion-portfolio:$COMMIT_SHA"
      - "."

  - name: "us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/diffusion-portfolio:$COMMIT_SHA"
    entrypoint: "python"
    args:
      - "-m"
      - "pytest"
      - "-q"
      - "tests/test_api.py"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/diffusion-portfolio:$COMMIT_SHA"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "diffusion-portfolio"
      - "--image=us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/diffusion-portfolio:$COMMIT_SHA"
      - "--region=us-east1"
      - "--platform=managed"
      - "--port=8080"
      - "--memory=2Gi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=1"
      - "--concurrency=1"
      - "--timeout=3600s"
      - "--no-allow-unauthenticated"
      - "--invoker-iam-check"
      - "--quiet"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "diffusion-portfolio-api"
      - "--image=us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/diffusion-portfolio:$COMMIT_SHA"
      - "--region=us-east1"
      - "--platform=managed"
      - "--set-env-vars=APP_MODE=api,GOOGLE_OAUTH_CLIENT_IDS=$_GOOGLE_OAUTH_CLIENT_IDS,ALLOWED_GOOGLE_EMAILS=$_ALLOWED_GOOGLE_EMAILS"
      - "--port=8080"
      - "--memory=2Gi"
      - "--cpu=1"
      - "--min-instances=0"
      - "--max-instances=1"
      - "--concurrency=1"
      - "--timeout=3600s"
      - "--no-invoker-iam-check"
      - "--quiet"

images:
  - "us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/diffusion-portfolio:$COMMIT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s
